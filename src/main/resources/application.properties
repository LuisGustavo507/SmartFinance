spring.application.name=SmartFinance
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
smartfinance.security.cookie-secure=${SMARTFINANCE_COOKIE_SECURE:true}

# Runtime compatible with a platform that injects PORT and terminates TLS.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true

# Only the aggregate health endpoint is public. Details stay hidden.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
