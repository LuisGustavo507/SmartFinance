spring.application.name=SmartFinance
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
smartfinance.security.cookie-secure=${SMARTFINANCE_COOKIE_SECURE:true}

# Runtime compatible with a platform that injects PORT and terminates TLS.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true

# Only the aggregate health endpoint is public. Details stay hidden.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Business dates and scheduled jobs follow Brazil's time zone.
smartfinance.time-zone=${SMARTFINANCE_TIME_ZONE:America/Sao_Paulo}

# In-memory throttling for authentication endpoints (single instance).
# trust-forwarded-for must stay false unless a proxy overwrites X-Forwarded-For.
smartfinance.security.rate-limit.enabled=${SMARTFINANCE_RATE_LIMIT_ENABLED:true}
smartfinance.security.rate-limit.trust-forwarded-for=${SMARTFINANCE_TRUST_FORWARDED_FOR:false}
smartfinance.security.rate-limit.login-failures=${SMARTFINANCE_LOGIN_FAILURES:10}
smartfinance.security.rate-limit.login-window=PT15M
smartfinance.security.rate-limit.register=${SMARTFINANCE_REGISTER_LIMIT:5}
smartfinance.security.rate-limit.register-window=PT1H
smartfinance.security.rate-limit.refresh=${SMARTFINANCE_REFRESH_LIMIT:60}
smartfinance.security.rate-limit.refresh-window=PT15M

# Errors are rendered as JSON problems by ApiErrorController; internals never leak.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Every log line carries the request id also returned in the X-Request-Id header.
logging.pattern.correlation=[%X{requestId:-}]\ 

# Spring logs the whole binding result, including rejected values such as
# passwords. Validation problems are already returned to the client.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
